# MX Master 4 via Logi Bolt receiver.
#
# Button map (evtest /dev/input/event29 "Logitech USB Receiver Mouse"):
#   left         272  BTN_LEFT     -> mouse:272
#   right        273  BTN_RIGHT    -> mouse:273
#   wheel press  274  BTN_MIDDLE   -> mouse:274
#   thumb 1      276  BTN_EXTRA    -> mouse:276
#   thumb 2      275  BTN_SIDE     -> mouse:275
#   thumb 3      277  BTN_FORWARD  -> mouse:277
#   big button   278  BTN_BACK     -> mouse:278
# Thumb wheel also exposes REL_HWHEEL (horizontal scroll), not a button.
#
# sensitivity: -1.0 .. 1.0 (0 = untouched). Raise to move faster.
device {
    name          = logitech-usb-receiver-mouse
    accel_profile = flat
    sensitivity   = 0.5

    # Wheel press (BTN_MIDDLE) held + move = scroll. libinput replays the
    # click if the button is released without moving, so middle-click paste
    # and open-in-new-tab still work, just with a short delay.
    scroll_method = on_button_down
    scroll_button = 274
}

# Thumb wheel (REL_HWHEEL) = volume, with avizo OSD. Global bind, so apps no
# longer receive horizontal scroll from this wheel.
#
# scroll_event_delay must be 0: with the default 300ms, Hyprland consumes only
# one scroll event per window and passes the rest through, so the thumb wheel
# (hi-res, no detents) leaks horizontal scroll into apps between volume steps.
# With 0 every event fires the bind, so the step is 1% — a full flick is a
# stream of events and the wheel acts as an analog volume slider.
binds {
    scroll_event_delay = 0
}
bindl = , mouse_right, exec, volumectl down 1
bindl = , mouse_left, exec, volumectl up 1

# Big button (BTN_BACK) held = drag window, no modifier. Disabled: it stole
# BTN_BACK from apps (browser "back"). Use $mainMod + LMB to drag instead.
# bindm = , mouse:278, movewindow

# t3 (BTN_FORWARD) = select region, screenshot it straight to the clipboard.
# Global bind, so browser "forward" on this button is gone.
bind = , mouse:277, exec, bash -c 'grim -g "$(slurp)" - | wl-copy -t image/png'
# Shift + t3 = same region, but hand it to swappy to annotate (as $mainModShift+S).
bind = SHIFT, mouse:277, exec, bash -c 'grim -g "$(slurp)" /tmp/screenshot.png && swappy -f /tmp/screenshot.png'
# Ctrl + t3 = same region, ask a question about it, answer from the litellm
# vision model in a floating kitty running pi (ask-screenshot, ~/.bin-private).
bind = CTRL, mouse:277, exec, ask-screenshot
