monitor=desc:Samsung Electric Company C34H89x H4ZT300037, 3440x1440@60Hz, -600x-1152, 1.25

# G9 (Odyssey G95NC) — single-input mode, full native width.
# If it flickers, disable adaptive backlight / local dimming on the monitor
# itself; dropping the refresh rate is not the fix for flicker.
# PBP mode is no longer supported here (halves share desc+serial, so they
# cannot be told apart statically) — was handled by the removed g9-layout.sh.
#
# Deliberately 60Hz, not the panel's native 120: at 7680x2160 the refresh rate
# is a constant cost even on a static desktop, and halving it measured ~2W off
# the package and dropped the APU from ~62C to ~56C at idle. That is fan noise,
# which matters more here than cursor smoothness. Raise it back to 120Hz if this
# machine is ever wanted for motion over quiet.
monitor=desc:Samsung Electric Company Odyssey G95NC HNTY300014, 7680x2160@60Hz, 1440x0, 1.5

workspace = m[desc:Invalid Vendor Codename - RTK 0x2775 0x20230814], gapsout:4, gapsin:4, rounding:false, bordersize:1

exec-once = hyprpaper &
exec = ~/.config/hypr/bin/wallpapers.py > ~/.tmp/logs/wallpapers.py.log
