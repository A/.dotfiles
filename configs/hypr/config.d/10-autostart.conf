exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/bin/persist-logs.sh
exec-once = swaync &
exec-once = nm-applet --indicator &
exec-once = udiskie -an --tray -f thunar &
exec-once = pasystray &
exec-once = ~/.config/hypr/bin/uair.sh
exec-once = avizo-service
exec-once = ~/.config/waybar/restart
exec-once = hypridle
exec-once = ~/.config/hypr/bin/edp-refresh.sh
exec = ~/.config/hypr/bin/edp-refresh.sh --once
exec-once = hyprshade auto
exec-once = ~/.bin/zapusk-start
exec-once = wlr-brightness
exec-once = blueman-applet
