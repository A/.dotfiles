[defaults]
host_key_checking     = False
# The private companion repo is optional; ansible warns and skips it if absent.
inventory             = hosts.yml,../.dotfiles-private/hosts.yml
stdout_callback       = unixy
display_ok_hosts      = true
display_skipped_hosts = false
transport             = local
local_tmp            = /var/tmp/.ansible

[privilege_escalation]
become_method         = sudo
become_ask_pass       = False
