scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter_emperor
    static_configs:
      - targets: ["node_exporter:9100"]

  # --- Redpanda tracking prototype (joined via external monitoring network) ---
  # 15s scrape so rate()/lag over [1m] windows have enough samples.
  - job_name: redpanda
    metrics_path: /public_metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: kminion
    scrape_interval: 15s
    static_configs:
      - targets: ["kminion:8080"]

  # --- Kafka variant (protocol-based exporter; Kafka has no native endpoint) ---
  - job_name: kafka-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["kafka-exporter:9308"]
